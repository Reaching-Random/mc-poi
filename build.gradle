plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs "--username", "DevUser"
			// Load .env.development if it exists
			def envFile = project.file(".env.development")
			if (envFile.exists()) {
				envFile.eachLine { line ->
					line = line.trim()
					if (line.isEmpty() || line.startsWith("#")) return
					def parts = line.split("=", 2)
					if (parts.length == 2) {
						def key = parts[0].trim()
						def value = parts[1].trim()
						// Pass as system property via vmArg
						vmArg "-D${key.toLowerCase().replace("_", ".")}=" + value
					}
				}
			}
		}
	}
	
	mods {
		"points-of-interest" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ── JSON Schema validation (networknt) ──────────────────────────────────────
	// Used to validate offline POI data files against the bundled poi-state-v1.json schema.
	// All deps are shaded into the mod JAR via `include` so they don't conflict with
	// other mods or the game runtime.
	include(implementation('com.networknt:json-schema-validator:1.5.3'))
	include(implementation('com.fasterxml.jackson.core:jackson-core:2.17.2'))
	include(implementation('com.fasterxml.jackson.core:jackson-databind:2.17.2'))
	include(implementation('com.fasterxml.jackson.core:jackson-annotations:2.17.2'))
	// commons-lang3 and slf4j-api are already provided by the Minecraft runtime.
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}