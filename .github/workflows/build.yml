name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Generate a new release'
        type: boolean
        default: false

jobs:
  build:
    uses: Reaching-Random/gh-actions/.github/workflows/minecraft/build.yml@main
    with:
      minecraft_version: '1.21.11'
      java_version: '25'
      create_release: ${{ inputs.create_release == true }}
    permissions:
      contents: write
